# LightsOut triage policy. One rule per line: <job> <source> <action>.
# This repository's jobs are mostly hands-off, so the default is human. The one
# exception is brag-sweep: its engine's doctor probe can 503 for a second, and
# a retryable block plus `run --auto-repair` turns that into one bounded rerun
# instead of a stop that waits for a person.
#
#   *                  lock           repair:stale-marker
#   everyday-laws      gate:duration  agent:apply
#   everyday-laws      gate:sections  agent:propose
#   brag-sweep         sweep          retry
#
# Actions: human, retry, repair:<name>, agent:propose, agent:apply.
brag-sweep sweep retry
* * human
