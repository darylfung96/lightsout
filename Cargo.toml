[package]
name = "lightsout"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "LightsOut manager — the run contract, guards, gates and dashboard for unattended jobs"
license = "MIT"
repository = "https://github.com/darylfung96/lightsout"
homepage = "https://github.com/darylfung96/lightsout"
readme = "README.md"
keywords = ["cli", "automation", "jobs", "scheduler", "gates"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "LICENSE",
    "README.md",
    "src/**/*",
    "lib/*.sh",
    "jobs/noop/job.sh",
    "jobs/everyday-laws/**/*",
    "notes/**/*",
    "spec/**/*",
    "bin/job",
    "bin/report",
    "bin/scaffold",
    "docs/install.md",
    "install.sh",
    "packaging/homebrew/lightsout.rb",
    "packaging/macos-sign.sh",
    "tests/**/*",
]

[[bin]]
name = "lightsout"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.140"

[profile.release]
strip = true
lto = true
