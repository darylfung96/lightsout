# One pinned agent for the lesson writer and the repair that follows it.
#
# The patch restores the credential store and pins OpenCode Go's
# deepseek-v4.1-flash at high reasoning (the `/inference/go/` route). Without it
# a headless call uses the dsh default, which is a different provider and model
# from the daily build.
#
# `~` expands to $HOME; edit this path if the video checkout moves.
runner = dsh
patch = ~/programming/video-automation/automation/headless.patch.yml
